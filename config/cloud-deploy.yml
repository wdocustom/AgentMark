# AgentMark Cloud Deployment Configuration
# Supports: AWS ECS, GCP Cloud Run, or any Docker-compatible platform
#
# This config defines the recommended cloud architecture.
# Use your preferred IaC tool (Terraform, Pulumi, CDK) to implement.

architecture:
  name: agentmark-production
  region: us-east-1  # Change to your preferred region

services:
  api:
    image: agentmark/api:latest
    cpu: 1024      # 1 vCPU
    memory: 2048   # 2 GB
    replicas:
      min: 2
      max: 10
    autoscaling:
      metric: cpu
      target: 70
    healthcheck:
      path: /health
      interval: 30s
    ports:
      - 4000

  web:
    image: agentmark/web:latest
    cpu: 512       # 0.5 vCPU
    memory: 1024   # 1 GB
    replicas:
      min: 2
      max: 5
    autoscaling:
      metric: cpu
      target: 70
    ports:
      - 3000

  database:
    engine: postgresql
    version: "16"
    instance: db.r6g.large  # AWS RDS / Cloud SQL equivalent
    storage: 100  # GB
    backup:
      retention: 30  # days
      window: "03:00-04:00"
    multi_az: true

  cache:
    engine: redis
    version: "7"
    instance: cache.r6g.large  # ElastiCache / Memorystore equivalent
    replicas: 1

  cdn:
    provider: cloudfront  # or Cloud CDN
    origins:
      - web
    cache_behaviors:
      - path: /tracker.js
        ttl: 3600
      - path: /_next/static/*
        ttl: 31536000
      - path: /t/*
        ttl: 0  # No caching for tracking

  load_balancer:
    type: application
    listeners:
      - port: 443
        protocol: https
        targets:
          - service: web
            port: 3000
            path: /*
          - service: api
            port: 4000
            path: /api/*
          - service: api
            port: 4000
            path: /t/*

networking:
  vpc:
    cidr: 10.0.0.0/16
    public_subnets: 2
    private_subnets: 2
  security:
    - name: api
      ingress:
        - port: 4000
          source: load_balancer
    - name: database
      ingress:
        - port: 5432
          source: api
    - name: cache
      ingress:
        - port: 6379
          source: api

monitoring:
  logs:
    retention: 30  # days
  alerts:
    - name: high_error_rate
      metric: http_5xx_count
      threshold: 10
      period: 5m
    - name: high_latency
      metric: response_time_p99
      threshold: 2000  # ms
      period: 5m
    - name: database_connections
      metric: db_connections
      threshold: 80  # percent
      period: 5m
